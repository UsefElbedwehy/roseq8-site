<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ورد الكويت</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f6f5fa; color: #1c1d3a; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #5b5c78; margin: 0 0 20px; }
  video { width: 100%; border-radius: 20px; background: #000; max-height: 70vh; }
  .missing { display: none; padding: 40px 0; color: #5b5c78; }
</style>
</head>
<body>
<main>
  <h1>رسالة لك 🌸</h1>
  <p>أرسل لك أحدهم هذه الرسالة مع الورد</p>
  <video id="v" controls playsinline preload="metadata"></video>
  <div class="missing" id="missing">تعذّر تشغيل الفيديو</div>
</main>
<script>
  var id = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  var v = document.getElementById("v");
  if (!/^[0-9a-f-]{36}$/i.test(id)) { v.style.display = "none"; document.getElementById("missing").style.display = "block"; }
  else {
    v.src = "https://jczqbwhqqmltkidgypfa.supabase.co/storage/v1/object/public/gift-videos/" + id + ".mp4";
    v.addEventListener("error", function () { v.style.display = "none"; document.getElementById("missing").style.display = "block"; });
  }
</script>
</body>
</html>
